<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Chrysalis — Personal Digital Security Audit</title>
  <meta name="description" content="An open resilience framework for hardening your digital life against AI-augmented attacks. Free guides, tools, worksheets, and agent prompts.">
  <meta property="og:title" content="Project Chrysalis">
  <meta property="og:description" content="An open resilience framework for hardening your digital life against AI-augmented attacks.">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --theme-color: #2d6a4f;
      --base-font-size: 16px;
      --cover-background-color: #1b2d27;
      --cover-color: #fff;
    }
    .sidebar {
      border-right: 1px solid #eee;
    }
    .markdown-section h1:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading Project Chrysalis...</div>

  <script>
    window.$docsify = {
      name: 'Project Chrysalis',
      repo: 'https://github.com/yoans/personal-digital-security-audit',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: false,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the guides...',
        noData: 'Nothing found.',
        depth: 4
      },
      plugins: [
        function(hook) {
          hook.beforeEach(function(html) {
            return html;
          });
        }
      ]
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
